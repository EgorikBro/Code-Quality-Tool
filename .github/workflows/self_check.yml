name: Self Check & Report Generation

on:
  schedule:
    - cron: '0 0 * * 1' # Every Monday at midnight
  workflow_dispatch:      # Manual trigger

jobs:
  analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./code_quality_tool

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Run Analysis on src/
      run: |
        python main.py src/ --output src_report
    - name: Run Analysis on examples/
      run: |
        python main.py examples/ --output examples_report
    - name: Upload Reports
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-reports
        path: |
          code_quality_tool/src_report.md
          code_quality_tool/src_report.json
          code_quality_tool/examples_report.md
          code_quality_tool/examples_report.json

